an><b>${BRL(c.revenue)}</b></div><div class="simline"><span>Aquisição hipotética</span><b>${BRL(c.acquisition)}</b></div><div class="simline"><span>Tributos simulados</span><b>${BRL(c.trib)}</b></div><div class="simline"><span>Frete simulado</span><b>${BRL(c.fre)}</b></div><div class="simline"><span>Outras despesas simuladas</span><b>${BRL(c.oth)}</b></div><div class="simline"><span>Custo total indicativo</span><b>${BRL(c.total)}</b></div><div class="simline"><span>Resultado indicativo</span><b style="color:${c.result>=0?'#15795e':'#b94d4c'}">${BRL(c.result)}</b></div><div class="simline"><span>Margem calculada</span><b>${pct(c.margin)}</b></div><div class="simline"><span>Venda mínima para margem-alvo</span><b>${BRL(c.minimum)}</b></div></div>${c.pending.length?'<div class="notice" style="margin-top:14px">Resultado parcial: existem itens selecionados sem custo. Esses itens não foram considerados na receita e nos custos simulados; o resultado não representa a carteira completa.</div>':''}${c.minimum!==null&&c.minimum>c.ref?'<div class="notice" style="margin-top:14px">A venda mínima calculada supera o valor de referência dos itens precificados. Revisar parâmetros ou retirar itens desfavoráveis.</div>':''}${c.minimum===null?'<div class="notice" style="margin-top:14px">Não há solução de venda mínima para a margem-alvo com os parâmetros informados.</div>':''}${c.priced.length===0?'<div class="notice" style="margin-top:14px">Não há itens com custo para simulação. Resultado econômico não aplicável.</div>':''}`}</section></div>`;}

function renderDecision(){const d=decisionObj(),c=d.c;return pageHead('CENTRAL DE DECISÃO','GOV Decision','Parecer gerencial explicável com indicadores, evidências, limites e próximos passos.',btn('Imprimir parecer','window.print()')+btn('Exportar JSON','downloadReport()','primary'))+warn+`<section class="panel printable"><div class="panelhead"><h3>Parecer preliminar · ${esc(current().id)}</h3>${pill(d.state,d.color)}</div><p class="helper">Data de emissão: 25/11/2026 (referência fixa da demonstração). Esta saída é automática apenas sobre dados simulados e não representa aprovação de participação.</p><div class="cards" style="margin-top:20px"><div class="card"><div class="metric-label">Itens selecionados</div><div class="metric-value">${c.arr.length}</div><div class="metric-foot">${c.pending.length} sem custo</div></div><div class="card"><div class="metric-label">Receita simulada*</div><div class="metric-value" style="font-size:21px">${c.priced.length?BRL(c.revenue):'—'}</div><div class="metric-foot">Parte precificada</div></div><div class="card"><div class="metric-label">Resultado indicativo*</div><div class="metric-value" style="font-size:21px">${c.priced.length?BRL(c.result):'—'}</div><div class="metric-foot">Não é lucro líquido</div></div><div class="card"><div class="metric-label">Margem indicativa*</div><div class="metric-value">${c.priced.length?pct(c.margin):'—'}</div><div class="metric-foot">Sem validação fiscal</div></div></div><div class="report"><div class="eyebrow">PARECER EXECUTIVO DEMONSTRATIVO</div><h3>${esc(d.state)}</h3><p><strong>Objeto:</strong> ${esc(current().title)} — ${esc(current().org)}. Registro inteiramente fictício, usado exclusivamente na demonstração do fluxo analítico.</p><p><strong>Leitura econômica:</strong> ${c.priced.length?`a carteira precificada apresenta receita simulada de ${BRL(c.revenue)}, custo total indicativo de ${BRL(c.total)} e diferença de ${BRL(c.result)} (${pct(c.margin)}).`:'não existem itens com custos que permitam projetar resultado.'} ${c.pending.length?`${c.pending.length} item(ns) selecionado(s) sem custo impedem uma avaliação integral.`:''}</p><p><strong>Leitura técnica:</strong> não há comprovação de equivalência técnica homologada, cotação firme, estoque ou habilitação. Nenhuma recomendação pode ser transformada automaticamente em autorização de oferta.</p><p><strong>Capital e recebimento:</strong> o custo de aquisição de ${BRL(c.acquisition)} é apenas uma referência hipotética de desembolso para a parte precificada, não capital de giro completo. Prazo de pagamento e risco real do órgão não foram avaliados.</p><p><strong>Condicionantes:</strong> validar edital e unidade de disputa, documentar cotações, confirmar aderência técnica, tributos efetivos, frete, garantias, habilitação, prazo e capacidade financeira.</p><p><strong>Decisão humana:</strong> obrigatória antes de qualquer compromisso comercial.</p></div><div class="actions" style="margin-top:16px">${btn('Revisar carteira',"go('simulator')")}${btn('Examinar fornecedores',"go('sourcing')")}</div></section><div class="notice blue">*Os resultados refletem apenas itens com custo hipotético e parâmetros informados na demonstração. Não incluem validação de preços, impostos reais, custos financeiros, risco jurídico ou previsão de vitória em certame.</div>`;}
function downloadReport(){const d=decisionObj(),c=d.c;const payload={produto:'GOV Decision',versao:'1.0-demo',tipo:'DEMONSTRACAO_FICTICIA',aviso:'Dados integralmente simulados; nao usar em propostas reais.',processo:current().id,parecer:d.state,carteira:c.arr.map(x=>({id:x.id,item:x.name,quantidade:x.qty,referencia_unitaria:x.estimate,custo_unitario_hipotetico:x.cost})),parametros:{desconto_percentual:discount,tributos_percentual:tax,frete_percentual:freight,outras_despesas_percentual:other,margem_alvo_percentual:target,despesa_fixa:extra},resultado:{itens_precificados:c.priced.length,itens_pendentes:c.pending.length,receita_parcial:c.priced.length?c.revenue:null,custo_total_parcial:c.priced.length?c.total:null,resultado_parcial:c.priced.length?c.result:null,margem_parcial:c.priced.length?c.margin:null,venda_minima:c.priced.length?c.minimum:null},validacao:{cotacoes_firmes:0,equivalencias_homologadas:0,revisao_humana:'pendente'}};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='gov-decision-parecer-demo.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);}

/* Camada PNCP real: coletor roda fora do browser, dados sao apenas leitura. */
let pncpRows=[],pncpMeta=null,pncpError='Carregando arquivo regional...',pncpPage=1,pncpSearch='',pncpUF='',pncpMode='',pncpKind='',pncpCity='',pncpSort='recent',pncpPageSize=50,pncpSelected=null;
const pncpNum=n=>Number(n).toLocaleString('pt-BR');
const pncpModalities={'4':'Concorrência eletrônica','6':'Pregão eletrônico','8':'Dispensa'};
const pncpUFNames={AL:'Alagoas',BA:'Bahia',CE:'Ceará',MA:'Maranhão',PB:'Paraíba',PE:'Pernambuco',PI:'Piauí',RN:'Rio Grande do Norte',SE:'Sergipe'};
const pncpTxt=x=>x==null?'':String(x);
const pncpDay=x=>{const s=pncpTxt(x).slice(0,10);return /^\d{4}-\d\d-\d\d$/.test(s)?s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4):s||'—'};
const pncpValue=v=>(v===null||v===undefined||v===''||!Number.isFinite(Number(v)))?'Não informado':BRL(Number(v));
const pncpOfficialUrl=x=>{const m=/^(\d{14})-\d-(\d{6})\/(\d{4})$/.exec(pncpTxt(x.numero_pncp));return m?'https://pncp.gov.br/app/editais/'+m[1]+'/'+m[3]+'/'+Number(m[2]):''};
function pncpFiltered(){
 let arr=pncpRows.filter(x=>(!pncpUF||x.uf===pncpUF)&&(!pncpMode||String(x.modalidade)===pncpMode)&&(!pncpKind||x.tipo_objeto_indicativo===pncpKind)&&(!pncpCity||x.municipio===pncpCity)&&(!pncpSearch||[x.numero_pncp,x.objeto,x.orgao,x.orgao_cnpj,x.municipio,x.unidade_nome].map(pncpTxt).join(' ').toLocaleLowerCase('pt-BR').includes(pncpSearch.toLocaleLowerCase('pt-BR'))));
 if(pncpSort==='high')arr.sort((a,b)=>Number(b.valor_estimado||0)-Number(a.valor_estimado||0));else if(pncpSort==='low')arr.sort((a,b)=>Number(a.valor_estimado||0)-Number(b.valor_estimado||0));else arr.sort((a,b)=>pncpTxt(b.publicacao).localeCompare(pncpTxt(a.publicacao)));
 return arr;
}
const pncpOpt=(values,current,all)=>'<option value="">'+esc(all)+'</option>'+values.map(v=>'<option value="'+esc(v)+'"'+(v===current?' selected':'')+'>'+esc(v)+'</option>').join('');
function pncpControls(){
 const ufs=[...new Set(pncpRows.map(x=>x.uf).filter(Boolean))].sort(),cities=[...new Set(pncpRows.filter(x=>!pncpUF||x.uf===pncpUF).map(x=>x.municipio).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
 const modes=[...new Set(pncpRows.map(x=>String(x.modalidade)))].sort();
 return '<div class="filters">'+
 '<input id="pncpSearch" type="search" aria-label="Pesquisar processos" placeholder="Buscar objeto, órgão, município, CNPJ, PNCP" value="'+esc(pncpSearch)+'">'+
 '<select id="pncpUF" aria-label="Estado">'+pncpOpt(ufs,pncpUF,'Todas as UFs')+'</select>'+
 '<select id="pncpCity" aria-label="Município">'+pncpOpt(cities,pncpCity,'Todos os municípios')+'</select>'+
 '<select id="pncpMode" aria-label="Modalidade"><option value="">Todas as modalidades</option>'+modes.map(m=>'<option value="'+m+'"'+(m===pncpMode?' selected':'')+'>'+esc(pncpModalities[m]||m)+'</option>').join('')+'</select>'+
 '<select id="pncpKind" aria-label="Tipo de objeto (indicativo)"><option value="">Todos os tipos</option>'+[['material_ou_bem','Materiais / bens'],['servico','Serviços'],['misto','Mistos'],['indeterminado','Indeterminados']].map(([v,t])=>'<option value="'+v+'"'+(v===pncpKind?' selected':'')+'>'+t+'</option>').join('')+'</select>'+
 '<select id="pncpSort" aria-label="Ordenação"><option value="recent"'+(pncpSort==='recent'?' selected':'')+'>Publicação mais recente</option><option value="high"'+(pncpSort==='high'?' selected':'')+'>Maior valor</option><option value="low"'+(pncpSort==='low'?' selected':'')+'>Menor valor</option></select>'+
 '<select id="pncpPageSize" aria-label="Registros por página">'+[25,50,100].map(n=>'<option value="'+n+'"'+(n===pncpPageSize?' selected':'')+'>'+n+' por página</option>').join('')+'</select>'+
 btn('Limpar filtros','pncpClear()')+'</div>';
}
function pncpRadarRows(arr){return arr.map(x=>'<tr><td><strong>'+esc(x.objeto||'Sem descrição')+'</strong><small>'+esc(x.orgao||'Órgão não informado')+' · '+esc(x.numero_pncp||'—')+'</small></td><td>'+esc(x.uf||'—')+'<small>'+esc(x.municipio||'—')+'</small></td><td>'+esc(pncpModalities[x.modalidade]||'Não informada')+'</td><td>'+pncpValue(x.valor_estimado)+'</td><td>'+pncpDay(x.publicacao)+'</td><td>'+btn('Detalhar','pncpOpen('+JSON.stringify(x.numero_pncp)+')','primary')+'</td></tr>').join('')||'<tr><td colspan="6" class="empty">Nenhum registro atende aos filtros.</td></tr>'}
function renderRadarPNCP(){
 const filtered=pncpFiltered(),pages=Math.max(1,Math.ceil(filtered.length/pncpPageSize));pncpPage=Math.max(1,Math.min(pncpPage,pages));
 const rows=filtered.slice((pncpPage-1)*pncpPageSize,pncpPage*pncpPageSize);
 const metadata=pncpMeta?'Fonte: PNCP · exportado em '+esc(new Date(pncpMeta.gerado_utc).toLocaleString('pt-BR'))+' · dados não atualizados em tempo real':'Não foi possível carregar o arquivo exportado.';
 const info=pncpMeta?'Coleta publicada de 25 a 27/11/2026, nove estados do Nordeste e três modalidades.':'Base PNCP indisponível.';
 return pageHead('MERCADO PÚBLICO · DADOS REAIS','Radar de oportunidades',info)+
 (!pncpMeta?'<div class="notice">'+esc(pncpError)+' Nenhum processo simulado será exibido como real.</div>':'')+
 '<div class="cards"><div class="card"><div class="metric-label">Contratações coletadas</div><div class="metric-value">'+pncpNum(pncpRows.length)+'</div><div class="metric-foot">Registros do PNCP (histórico)</div></div><div class="card"><div class="metric-label">UFs representadas</div><div class="metric-value">'+new Set(pncpRows.map(x=>x.uf)).size+'</div><div class="metric-foot">Nordeste</div></div><div class="card"><div class="metric-label">Modalidades</div><div class="metric-value">'+new Set(pncpRows.map(x=>x.modalidade)).size+'</div><div class="metric-foot">Pregão, dispensa e concorrência</div></div><div class="card"><div class="metric-label">Resultados nos filtros</div><div class="metric-value">'+pncpNum(filtered.length)+'</div><div class="metric-foot">Filtragem local do JSON</div></div></div>'+
 '<div class="panel"><div class="panelhead"><h3>Contratações publicadas no PNCP</h3>'+pill('Base pública / lote estático','blue')+'</div><div class="radar-data-meta">'+metadata+'</div>'+pncpControls()+
 '<div class="tablewrap"><table class="radar-table"><thead><tr><th>Processo / Objeto</th><th>UF / Município</th><th>Modalidade</th><th>Valor estimado</th><th>Publicação</th><th>Ação</th></tr></thead><tbody id="pncpBody">'+pncpRadarRows(rows)+'</tbody></table></div>'+
 '<div class="radar-pager"><span id="pncpPageInfo">'+pncpNum(filtered.length)+' resultados · Página '+pncpPage+' de '+pages+'</span>'+btn('Anterior','pncpMove(-1)')+btn('Próxima','pncpMove(1)')+'</div></div>'+
 (pncpSelected?renderPNCPDetail(pncpSelected):'')+
 '<div class="notice blue">O valor é estimado, não uma proposta ou resultado de licitação. Tipo de objeto e fase são indicativos. Não existe análise automática de edital, itens, preços, habilitação ou aderência nesta base. As abas de Dossiê, Copiloto, Fornecedores, Viabilidade e Decisão ainda usam cenários fictícios independentes.</div>';
}
function pncpRefresh(){if(page!=='radar')return;const f=pncpFiltered(),pages=Math.max(1,Math.ceil(f.length/pncpPageSize));pncpPage=Math.max(1,Math.min(pncpPage,pages));const body=document.getElementById('pncpBody');if(body)body.innerHTML=pncpRadarRows(f.slice((pncpPage-1)*pncpPageSize,pncpPage*pncpPageSize));const label=document.getElementById('pncpPageInfo');if(label)label.textContent=pncpNum(f.length)+' resultados · Página '+pncpPage+' de '+pages;}
function pncpFilter(id,key){const el=document.getElementById(id);if(!el)return;window[key]=el.value;pncpPage=1;pncpSelected=null;render()}
function pncpClear(){pncpSearch=pncpUF=pncpMode=pncpKind=pncpCity='';pncpSort='recent';pncpPage=1;pncpSelected=null;render()}
function pncpMove(n){pncpPage+=n;pncpRefresh()}
function pncpOpen(id){pncpSelected=pncpRows.find(x=>x.numero_pncp===id)||null;render();document.getElementById('pncpSelectedDetail')?.scrollIntoView({behavior:'smooth',block:'nearest'})}
function renderPNCPDetail(x){const fields=[['Controle PNCP',x.numero_pncp],['Órgão',x.orgao],['CNPJ do órgão',x.orgao_cnpj],['Unidade',x.unidade_nome],['Município / UF',[x.municipio,x.uf].filter(Boolean).join(' / ')],['Modalidade',pncpModalities[x.modalidade]||x.modalidade_nome_indicativo],['Objeto',x.objeto],['Situação registrada',x.situacao],['Fase indicativa',x.fase_indicativa],['Tipo indicativo',x.tipo_objeto_indicativo],['Valor estimado',pncpValue(x.valor_estimado)],['Publicação',pncpDay(x.publicacao)],['Abertura',pncpDay(x.abertura)],['Encerramento',pncpDay(x.encerramento)]];
 const url=pncpOfficialUrl(x);
 return '<div class="panel radar-detail" id="pncpSelectedDetail"><div class="panelhead"><h3>Detalhes da contratação PNCP</h3>'+btn('Fechar','pncpSelected=null;render()')+'</div><dl>'+fields.map(([k,v])=>'<dt>'+esc(k)+'</dt><dd>'+esc(v||'Não informado')+'</dd>').join('')+'</dl>'+(url?'<div class="divider"></div><a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">Consultar processo no PNCP ↗</a>':'')+'<p class="helper" style="margin-top:14px">Confira condições, anexos e prazos no PNCP. Dossiê e simulação deste protótipo são independentes deste registro.</p></div>';
}
function renderOverviewPNCP(){
 const total=pncpRows.length,byUF={},byMode={};
 pncpRows.forEach(x=>{byUF[x.uf]=(byUF[x.uf]||0)+1;byMode[x.modalidade]=(byMode[x.modalidade]||0)+1});
 const entries=Object.entries(byUF).sort((a,b)=>b[1]-a[1]);
 return pageHead('REVIZI · GOV INTELLIGENCE','Visão executiva','Plataforma REVIZI: Radar com dados públicos históricos do PNCP, e módulos de apoio à decisão ainda demonstrativos.',btn('Abrir Radar PNCP',"go('radar')",'primary'))+
 (!pncpMeta?'<div class="notice">'+esc(pncpError)+'</div>':'<div class="notice blue">Coleta regional real: '+pncpNum(total)+' contratações · exportação de 27/11/2026. Não é consulta em tempo real. Outros módulos ainda não foram conectados a documentos, fornecedores ou custos reais.</div>')+
 '<div class="cards"><div class="card"><div class="metric-label">Contratações PNCP</div><div class="metric-value">'+pncpNum(total)+'</div><div class="metric-foot">Publicadas no recorte consultado</div></div><div class="card"><div class="metric-label">Estados do Nordeste</div><div class="metric-value">'+Object.keys(byUF).length+'</div><div class="metric-foot">UFs com registros</div></div><div class="card"><div class="metric-label">Pregões</div><div class="metric-value">'+pncpNum(byMode[6]||0)+'</div><div class="metric-foot">Modalidade 6</div></div><div class="card"><div class="metric-label">Dispensas + concorrências</div><div class="metric-value">'+pncpNum((byMode[8]||0)+(byMode[4]||0))+'</div><div class="metric-foot">Modalidades 8 e 4</div></div></div>'+
 '<div class="grid2"><div class="panel"><div class="panelhead"><h3>Distribuição por estado</h3>'+pill('Registros PNCP','blue')+'</div>'+entries.map(([k,v])=>'<div class="barrow"><div class="barhead"><span>'+esc(pncpUFNames[k]||k)+'</span><b>'+pncpNum(v)+'</b></div><div class="track"><div class="fill" style="width:'+(v/(entries[0]?.[1]||1)*100).toFixed(1)+'%"></div></div></div>').join('')+'</div>'+
 '<div class="panel"><h3>Cobertura operacional</h3><p class="helper">Situação real dos módulos, sem pressupor integrações que ainda não existem.</p>'+
 [['Radar PNCP','Coleta local, exportação JSON e consulta por filtros','ok'],['Dossiê do edital','Cenário demonstrativo, não vinculado aos registros PNCP','warn'],['Copiloto de editais','Sem análise documental real','warn'],['Fornecedores e preços','Cotações fictícias para demonstração','warn'],['Viabilidade e GOV Decision','Cálculos simulados, sem validação comercial','warn']].map(([a,b,c])=>'<div class="listrow"><span class="number">'+(c==='ok'?'✓':'·')+'</span><div><b>'+esc(a)+'</b><p>'+esc(b)+'</p></div></div>').join('')+'</div></div>';
}
async function pncpLoad(){try{const r=await fetch('./data/radar_pncp.json',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const p=await r.json();if(!p||!Array.isArray(p.registros)||p.registros.length!==p.total||p.registros.length===0)throw Error('estrutura ou total inválido');if(p.registros.some(x=>!x||!x.numero_pncp||!x.objeto||!x.uf||![4,6,8].includes(x.modalidade)))throw Error('registro incompatível');pncpRows=p.registros;pncpMeta=p;pncpError='';}catch(e){pncpRows=[];pncpMeta=null;pncpError='Base indisponível: '+e.message+'.';}render()}

function go(p){page=p;onlySelected=false;render();window.scrollTo({top:0,behavior:'instant'});}function render(){const labels={overview:'Visão executiva',radar:'Radar de oportunidades',dossier:'Dossiê do edital',copilot:'Copiloto de editais',sourcing:'Fornecedores & preços',simulator:'Viabilidade econômica',decision:'GOV Decision'};document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('breadcrumb').textContent=labels[page];document.getElementById('main-content').innerHTML=({overview:renderOverviewPNCP,radar:renderRadarPNCP,dossier:renderDossier,copilot:renderCopilot,sourcing:renderSourcing,simulator:renderSimulator,decision:renderDecision})[page]()+`<div class="footer">REVIZI · GOV Intelligence V1.2 · Radar: registros históricos reais PNCP · Demais módulos: cenários fictícios, sem IA conectada</div>`;}
document.querySelectorAll('.nav').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
document.addEventListener('input',e=>{if(e.target.id==='pncpSearch'){pncpSearch=e.target.value;pncpPage=1;pncpRefresh()}});
document.addEventListener('change',e=>{const m={pncpUF:'pncpUF',pncpCity:'pncpCity',pncpMode:'pncpMode',pncpKind:'pncpKind',pncpSort:'pncpSort',pncpPageSize:'pncpPageSize'};if(!m[e.target.id])return;const id=e.target.id;const val=e.target.value; if(id==='pncpPageSize')pncpPageSize=Number(val);else if(id==='pncpUF'){pncpUF=val;pncpCity=''}else if(id==='pncpCity')pncpCity=val;else if(id==='pncpMode')pncpMode=val;else if(id==='pncpKind')pncpKind=val;else pncpSort=val;pncpPage=1;pncpSelected=null;render();});
render();pncpLoad();
</script></body></html>
